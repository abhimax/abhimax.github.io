<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <script>
      (() => {
        const normalizePath = (pathname) => {
          if (!pathname || pathname === "/") return "/";
          return pathname.endsWith("/")
            ? pathname.replace(/\/+$/, "") || "/"
            : pathname;
        };

        const targetPath =
          normalizePath(location.pathname) + location.search + location.hash;

        sessionStorage.redirect = location.origin + targetPath;
      })();
    </script>
    <title>Redirecting...</title>
  </head>
  <body></body>
</html>
